<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>NovAmaxa Scan Viewer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: one phone-width column of stacked sections; widens to a centered 760px sheet with a real line table. */
:root{
  --bg:#f4f7f5; --card:#ffffff; --ink:#16201b; --ink-2:#4b5651; --ink-3:#7c8682;
  --rule:#dbe3df; --brand:#153226; --brand-2:#47725b; --tint:#e7efea;
  --ok:#1f7a4a; --ok-bg:#e3f3ea; --bad:#9b2c1f; --bad-bg:#fbe9e7; --warn:#8a5a00; --warn-bg:#fdf1d8;
  --due-fg:#ffffff; --due-sub:#bcd3c6; --logo-filter:none;
  --sans:"Inter","DejaVu Sans",system-ui,sans-serif;
  --mono:"JetBrains Mono","DejaVu Sans Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1512; --card:#151f1a; --ink:#e6eee9; --ink-2:#aebbb4; --ink-3:#7f8d86;
  --rule:#26332d; --brand:#1d4434; --brand-2:#7fb096; --tint:#1b2a23;
  --ok:#7fd3a3; --ok-bg:#14301f; --bad:#f2a397; --bad-bg:#3a1a15; --warn:#f0c46a; --warn-bg:#3a2c0e;
  --due-fg:#ffffff; --due-sub:#a9c7b7; --logo-filter:brightness(0) invert(.92);
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0e1512; --card:#151f1a; --ink:#e6eee9; --ink-2:#aebbb4; --ink-3:#7f8d86;
  --rule:#26332d; --brand:#1d4434; --brand-2:#7fb096; --tint:#1b2a23;
  --ok:#7fd3a3; --ok-bg:#14301f; --bad:#f2a397; --bad-bg:#3a1a15; --warn:#f0c46a; --warn-bg:#3a2c0e;
  --due-fg:#ffffff; --due-sub:#a9c7b7; --logo-filter:brightness(0) invert(.92);
  color-scheme:dark; }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);font-feature-settings:"tnum" 1;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 40px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.mono{font-family:var(--mono)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
section{background:var(--card);border:1px solid var(--rule);border-radius:6px;padding:14px 16px;min-width:0}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.top img{height:20px;width:auto;filter:var(--logo-filter)}
.src{font-size:12px;font-weight:600;padding:3px 8px;border-radius:3px}
.src.qr{background:var(--ok-bg);color:var(--ok)}
.src.demo{background:var(--warn-bg);color:var(--warn)}

.trust{display:flex;gap:12px;align-items:flex-start;border-width:1px 1px 1px 6px}
.trust.ok{border-color:var(--ok);background:var(--ok-bg)}
.trust.bad{border-color:var(--bad);background:var(--bad-bg)}
.trust .ic{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:var(--card)}
.trust.ok .ic{background:var(--ok)} .trust.bad .ic{background:var(--bad)}
.trust h2{margin:0;font-size:15px}
.trust.ok h2{color:var(--ok)} .trust.bad h2{color:var(--bad)}
.trust p{margin:3px 0 0;font-size:13px;color:var(--ink-2)}
.hero.unv{background:var(--card);border-color:var(--bad);color:var(--ink)}
.hero.unv .label,.hero.unv .row{color:var(--ink-3)}
.hero.unv .bal{text-decoration:line-through;text-decoration-color:var(--bad);text-decoration-thickness:2px;color:var(--ink-2)}
.hero{background:var(--brand);border-color:var(--brand);color:var(--due-fg);display:grid;gap:10px}
.hero .label{color:var(--due-sub)}
.hero h1{margin:0;font-size:15px;font-weight:600;text-wrap:balance}
.hero .bal{font-size:34px;font-weight:700;letter-spacing:-.01em;line-height:1.05}
.hero .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--due-sub)}
.pill{font-size:11px;font-weight:700;letter-spacing:.08em;padding:2px 7px;border-radius:3px}
.pill.OPEN{background:#ffffff22;color:#fff}
.pill.PAST{background:var(--bad-bg);color:var(--bad)}
.pill.PAID{background:var(--ok-bg);color:var(--ok)}

.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--ink-2)}
.chk b{flex:none;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px}
.chk.ok b{background:var(--ok-bg);color:var(--ok)}
.chk.bad b{background:var(--bad-bg);color:var(--bad)}

.refs{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px 16px}
.refs .v{font-weight:500;margin-top:2px;overflow-wrap:anywhere}

.lines h2,.tot h2{margin:0 0 6px}
.ln-list{display:flex;flex-direction:column}
.ln{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0;border-top:1px solid var(--rule)}
.ln:first-child{border-top:0}
.ln .pn{font-family:var(--mono);font-weight:600;font-size:14px;overflow-wrap:anywhere}
.ln .amt{font-weight:600}
.ln .ds{grid-column:1/-1;color:var(--ink)}
.ln .sp{grid-column:1/-1;color:var(--ink-2);font-size:13px}
.ln .math{grid-column:1/-1;color:var(--ink-3);font-size:13px}
.ln .po{color:var(--ink-3);font-family:var(--sans);font-weight:500;font-size:12px;margin-left:6px}

.pship{font-size:13px;color:var(--ink);background:var(--warn-bg);border-left:4px solid var(--warn);padding:8px 10px;border-radius:3px;margin:4px 0 6px}
.ln .bo{grid-column:1/-1;color:var(--warn);font-size:13px;font-weight:600}
.csvchk p{margin:6px 0 10px;font-size:13px;color:var(--ink-2)}
.csvchk .ok-line b{color:var(--ok)}
.file{position:relative;display:inline-flex;align-items:center;gap:8px;font:600 14px var(--sans);padding:9px 14px;border-radius:5px;border:1px solid var(--rule);background:var(--card);color:var(--ink);cursor:pointer}
.file input{position:absolute;opacity:0;width:1px;height:1px}
.file:focus-within{outline:2px solid var(--brand-2);outline-offset:2px}
.tot table{width:100%;border-collapse:collapse}
.tot td{padding:4px 0}
.tot td:first-child{color:var(--ink-2)}
.tot .t td{border-top:1px solid var(--ink);font-weight:700;padding-top:8px}
.tot .b td{color:var(--brand-2);font-weight:700;font-size:17px}

.actions{display:flex;gap:8px;flex-wrap:wrap}
button{font:600 14px var(--sans);padding:9px 14px;border-radius:5px;border:1px solid var(--rule);background:var(--card);color:var(--ink);cursor:pointer}
button.primary{background:var(--brand);border-color:var(--brand);color:#fff}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--brand-2);outline-offset:2px}
.toast{font-size:13px;color:var(--ok);min-height:1.2em}

details summary{cursor:pointer;font-weight:600}
textarea{width:100%;min-height:90px;margin-top:10px;font:12px/1.4 var(--mono);padding:8px;border-radius:5px;border:1px solid var(--rule);background:var(--bg);color:var(--ink)}
pre{margin:10px 0 0;padding:10px;background:var(--bg);border-radius:5px;overflow-x:auto;font:12px/1.5 var(--mono);color:var(--ink-2)}
.err{color:var(--bad);font-size:13px;margin-top:6px}
.foot{font-size:12px;color:var(--ink-3);text-align:center}

@media (min-width:640px){
  .hero{grid-template-columns:1fr auto;align-items:end}
  .hero .bal{font-size:40px;text-align:right}
}
</style>

</head>

    ship = {name:st_name, line1:st_l1, line2:st_l2, city:st_city, state:st_state, zip:st_zip, country:st_country};
    lines = rows.filter(r => r[0] === "L").map(r => ({
      ln:r[1], po_line:r[2], part:r[3], desc:r[4], spec:r[5], qty:r[6], uom:r[7], price:r[8], amount:r[9],
      ordered: r[10] ?? r[6], prev: r[11] ?? "0", bo: r[12] ?? "0", bo_date: r[13] || "" }));
  }
  return {ship,csvsha,detail:ver==="NVI1",ver,type,number,date,due,terms,ccy,po,so,account,customer,supplier,subtotal,freight,tax,total,paid,balance,count:+count,lines,raw:text};

// Minimal RFC 4180 reader for the attached CSV
function readCsv(text){
  const out = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){ if (c === '"'){ if (text[i+1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ","){ row.push(f); f = ""; }
    else if (c === "\n" || c === "\r"){ if (c === "\r" && text[i+1] === "\n") i++; row.push(f); out.push(row); row = []; f = ""; }
    else f += c;
  }
  if (f || row.length){ row.push(f); out.push(row); }
  const [head, ...body] = out; return body.filter(r => r.length > 1).map(r => Object.fromEntries(head.map((k,i) => [k, r[i] ?? ""])));
}
async function digest128(bytes){
  const h = new Uint8Array(await crypto.subtle.digest("SHA-256", bytes)).slice(0, 16);
  const A = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567"; let bits = 0, v = 0, o = "";
  for (const b of h){ v = (v << 8) | b; bits += 8; while (bits >= 5){ o += A[(v >>> (bits - 5)) & 31]; bits -= 5; } }
  if (bits) o += A[(v << (5 - bits)) & 31];
  return o;
}
function checks(d){
  const sum = d.lines.reduce((a,l) => a + cents(l.amount), 0);
  const ext = d.lines.every(l => Math.round(parseFloat(l.qty) * cents(l.price)) === cents(l.amount));
  return [
    [d.lines.length === d.count, `${d.lines.length} of ${d.count} lines present`],
    [ext, "Qty × price matches every line"],
    [sum === cents(d.subtotal), "Lines sum to subtotal"],
    [cents(d.subtotal) + cents(d.freight) + cents(d.tax) === cents(d.total), "Subtotal + freight + tax = total"],
    [cents(d.total) - cents(d.paid) === cents(d.balance), "Total − paid = balance"],

}
function status(d){
  if (cents(d.balance) <= 0) return ["PAID","Paid"];
  const today = new Date(); const iso = today.getFullYear()+"-"+String(today.getMonth()+1).padStart(2,"0")+"-"+String(today.getDate()).padStart(2,"0");
  if (iso > d.due){ const days = Math.round((new Date(iso) - new Date(d.due)) / 864e5); return ["PAST", `Past due ${days} day${days===1?"":"s"}`]; }
  return ["OPEN","Open"];
}
function csv(d){
  const q = v => /[",\n\r]/.test(v ?? "") ? `"${String(v).replace(/"/g,'""')}"` : (v ?? "");
  const head = ["invoice","invoice_date","due_date","po","po_line","sales_order","ship_to_name","ship_to_line1","ship_to_line2","ship_to_city","ship_to_state","ship_to_zip","ship_to_country","part","description","spec","qty_billed","uom","unit_price","amount","qty_ordered","qty_prev_shipped","qty_backorder","backorder_est_ship"];
  return [head.join(",")].concat(d.lines.map(l =>
    [d.number,d.date,d.due,d.po,l.po_line,d.so,d.ship.name,d.ship.line1,d.ship.line2,d.ship.city,d.ship.state,d.ship.zip,d.ship.country,l.part,l.desc,l.spec,l.qty,l.uom,l.price,l.amount,l.ordered,l.prev,l.bo,l.bo_date].map(q).join(","))).join("\r\n") + "\r\n";
}
async function copy(text, msg){
  const t = $("#toast");
  try { await navigator.clipboard.writeText(text); t.textContent = msg; }
  catch { $("#rawpre").closest("details").open = true; const r = document.createRange(); r.selectNodeContents($("#rawpre"));
          getSelection().removeAllRanges(); getSelection().addRange(r); t.textContent = "Copy blocked here. Raw data is selected below."; }
}
function render(d){
  const [sk, sl] = status(d); const ck = checks(d); const allOk = ck.every(c => c[0]);
  const boUnits = d.lines.reduce((a,l) => a + (+l.bo || 0), 0);
  const boValue = d.lines.reduce((a,l) => a + Math.round((+l.bo || 0) * cents(l.price)), 0);
  const tr = d.trust;

  </section>
  <section class="hero ${tr.ok ? "" : "unv"}">
    <div>

      <div class="row" style="margin-top:6px">${tr.ok ? `<span class="pill ${sk}">${esc(sl).toUpperCase()}</span>` : ""}<span>Due ${usdate(d.due)} · ${esc(d.terms)}</span></div>

  </section>

  <section class="refs">
    ${[["Customer PO",d.po,1],["Sales order",d.so,1],["Account",d.account,1],["Invoice date",usdate(d.date)],["Due date",usdate(d.due)],["Terms",d.terms]]
      .map(([k,v,m]) => `<div><div class="label">${k}</div><div class="v ${m?"mono":""}">${esc(v)}</div></div>`).join("")}
  </section>

  ${d.ship.line1 || d.ship.city ? `<section>
    <div class="label">Ship to</div>
    <div class="v" style="margin-top:4px;line-height:1.5"><b>${esc(d.ship.name)}</b><br>${esc([d.ship.line1, d.ship.line2].filter(Boolean).join(", "))}<br>${esc(d.ship.city)}, ${esc(d.ship.state)} ${esc(d.ship.zip)}${d.ship.country ? " · " + esc(d.ship.country) : ""}</div>

  <section class="lines">
    <h2 class="label">${d.lines.length} line items</h2>
    ${boUnits ? `<div class="pship"><b>Partial shipment.</b> This invoice bills only what shipped. <b>${boUnits} unit${boUnits===1?"":"s"} (${usd(boValue/100)}) on backorder</b>, not billed here.</div>` : ""}

      <div class="ln">
        <div class="pn">${esc(l.part)}${l.po_line ? `<span class="po">PO ln ${esc(l.po_line)}</span>` : ""}</div>
        <div class="amt num">${fmt(l.amount)}</div>
        ${l.desc ? `<div class="ds">${esc(l.desc)}</div>` : ""}
        ${l.spec ? `<div class="sp">${esc(l.spec)}</div>` : ""}
        <div class="math num" style="text-align:left">${+l.ordered !== +l.qty || +l.prev ? `${esc(l.qty)} of ${esc(l.ordered)} ${esc(l.uom)} billed` : `${esc(l.qty)} ${esc(l.uom)}`} × ${fmt(l.price)}</div>
        ${+l.bo ? `<div class="bo">${esc(l.bo)} on backorder${l.bo_date ? ` · est. ship ${usdate(l.bo_date)}` : ""}</div>` : ""}
      </div>`).join("")}</div>
  </section>

  ${d.csvsha ? `<section class="csvchk">
    <div class="label">${d.detail ? "Full detail verified" : "Descriptions, specs and ship-to"}</div>
    ${d.detail ? `<p class="ok-line"><b>✓</b> Loaded from the CSV attached to the invoice PDF. Its fingerprint matches this signed code.</p>`
      : `<p>Kept out of the QR to keep it small and scannable. They're in the CSV attached to the invoice PDF (paperclip next to the QR). Load that file here to check it is the genuine one and fill in the detail.</p>
    <label class="file"><input id="csvfile" type="file" accept=".csv,text/csv"><span>Check attached CSV</span></label>
    <div class="err" id="csverr" role="status"></div>`}
  </section>` : ""}

  <section class="tot">
    <table>
      <tr><td>Subtotal</td><td class="num">${fmt(d.subtotal)}</td></tr>
      <tr><td>Freight</td><td class="num">${fmt(d.freight)}</td></tr>
      <tr><td>Sales tax</td><td class="num">${fmt(d.tax)}</td></tr>
      <tr class="t"><td>Total</td><td class="num">${usd(d.total)}</td></tr>
      ${cents(d.paid) ? `<tr><td>Paid / credits</td><td class="num">(${fmt(d.paid)})</td></tr>` : ""}
      <tr class="b"><td>Balance due</td><td class="num">${usd(d.balance)}</td></tr>
    </table>
  </section>

  <section>
    <div class="actions">
      <button class="primary" id="dlcsv" type="button" hidden>Download ${d.detail ? "CSV" : "summary CSV"}</button>
      <button class="primary" id="cpcsv" type="button">Copy ${d.detail ? "lines" : "summary"} as CSV</button>
      <button id="cpraw" type="button">Copy raw data</button>
    </div>
    <div class="toast" id="toast" role="status"></div>
    <details><summary class="label" style="margin-top:6px">Raw payload (${esc(d.ver)})</summary><pre id="rawpre">${esc(d.raw)}</pre></details>
  </section>
  </div>`;
  $("#cpcsv").onclick = () => copy(csv(d), "Copied CSV. Paste into a spreadsheet or AP import.");
  const fi = $("#csvfile");
  if (fi) fi.onchange = async () => {
    const f = fi.files[0]; if (!f) return;
    const bytes = new Uint8Array(await f.arrayBuffer());

      return;
    }
    const rowsIn = readCsv(new TextDecoder("utf-8").decode(bytes).replace(/^\ufeff/, ""));
    const r0 = rowsIn[0] || {};

              state:r0.ship_to_state||"", zip:r0.ship_to_zip||"", country:r0.ship_to_country||""};
    d.lines.forEach((l, i) => { const m = rowsIn.find(r => r.po_line === l.po_line && r.part === l.part) || rowsIn[i] || {};

}
function b64(s){ return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }
function verify(kid, sig, raw){
  const k = KEYS[kid];
  if (!k) return {ok:false, title:"Unknown signing key", msg:`Key ${kid} is not a NovAmaxa key.`};
  if (k.status !== "active") return {ok:false, title:"Signing key revoked", msg:`Key ${kid} was revoked. Treat this invoice as not issued by NovAmaxa.`};
  if (!window.nacl) return {ok:false, title:"Could not check signature", msg:"The verification library did not load. Reload the page on a working connection."};
  const msg = new Uint8Array(DOMAIN.length + 1 + raw.length);
  msg.set(DOMAIN); msg[DOMAIN.length] = kid; msg.set(raw, DOMAIN.length + 1);
  return nacl.sign.detached.verify(msg, sig, b64(k.pub))
    ? {ok:true, title:"Verified: issued by NovAmaxa", msg:`Signature valid (key ${kid}). The data below is exactly what NovAmaxa's system issued.`}
    : {ok:false, title:"Signature does not match", msg:"This data was changed after it was issued, or was not issued by NovAmaxa."};
}
async function open_(blob){
  const bytes = b32(blob);
  if (bytes[0] === 0x01 && bytes.length > 66){
    const kid = bytes[1], sig = bytes.slice(2, 66);
    const text = await inflate(bytes.slice(66));
    return { text, trust: verify(kid, sig, new TextEncoder().encode(text)) };
  }
  if (bytes[0] === 0x78){
    return { text: await inflate(bytes), trust: {ok:false, title:"Unsigned invoice data", msg:"This code carries no NovAmaxa signature."} };
  }
  throw new Error("Not a NovAmaxa invoice code.");
}
async function load(blob, fromQr){
  const {text, trust} = await open_(blob);
  const d = parse(text); d.trust = trust;
  render(d);
  const s = $("#src"); s.className = "src " + (fromQr ? "qr" : "demo");
  s.textContent = fromQr ? "Decoded from scan" : "Sample data · invoice 10628";
  if (!trust.ok) { s.className = "src demo"; }
}
async function boot(){
  const h = location.hash.slice(1);
  // A scanned code that fails to decode must never fall back to the sample: that would show a different invoice.
  if (h.length > 20) {
    try { await load(h, true); }
    catch(e) {
      const s = $("#src"); s.className = "src demo"; s.textContent = "Could not read scan";
      $("#view").innerHTML = `<section class="trust bad" role="alert"><span class="ic" aria-hidden="true">!</span>
        <div><h2>This code could not be read</h2><p>It may be damaged, cut off, or made for a newer version of this page.
        Reload the page and scan again. If it still fails, confirm the invoice with NovAmaxa AR using contact details you already have on file.</p>
        <p class="mono" style="font-size:11px;margin-top:6px">${esc(e.message)} · viewer ${VIEWER_VERSION}</p></div></section>`;
    }
    return;
  }

$("#s-good").onclick = async () => { await load(DEMO, false); $("#dec").open = false; scrollTo({top:0,behavior:"smooth"}); };
$("#s-bad").onclick  = async () => { await load(TAMPERED, false); $("#dec").open = false; scrollTo({top:0,behavior:"smooth"}); };
$("#go").onclick = async () => {
  $("#perr").textContent = "";
  try { await load(blobFrom($("#paste").value), true); $("#dec").open = false; scrollTo({top:0,behavior:"smooth"}); }
  catch(e){ $("#perr").textContent = "Could not decode that. Paste the full link from the scan, starting with https://. " + (e.message.includes("NVI1") ? e.message : ""); }
};
addEventListener("hashchange", boot);
document.getElementById("vv").textContent = VIEWER_VERSION;
boot();
